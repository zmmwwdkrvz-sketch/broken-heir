<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Will of the Broken Heir</title>
<style>
:root{--ink:#1b1510;--paper:#efe4cc;--sep:#8a6a45}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#120e0a;color:var(--paper);font-family:Georgia,serif}
a{color:inherit}
#home{max-width:820px;margin:0 auto;padding:40px 20px}
h1{font-size:2.2em;letter-spacing:.04em;margin:.2em 0}.sub{color:#b9a07a;margin-bottom:28px}
.cover{width:100%;border:3px solid var(--sep);border-radius:4px;margin-bottom:24px}
.ch{display:flex;gap:16px;align-items:center;background:#1e1813;border:1px solid #3a2e22;border-radius:6px;padding:12px;margin:10px 0;cursor:pointer;text-decoration:none}
.ch:hover{border-color:var(--sep)}.ch img{width:160px;border-radius:3px}.ch b{font-size:1.2em}.ch small{display:block;color:#b9a07a;margin-top:4px}
.resume{display:inline-block;background:var(--sep);color:#fff;padding:10px 18px;border-radius:4px;text-decoration:none;margin-bottom:18px;cursor:pointer}
#reader{display:none;position:fixed;inset:0;flex-direction:column}
#bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#1e1813;border-bottom:1px solid #3a2e22;font-size:14px;transition:opacity .3s}
#bar button,#bar select{background:#2b221a;color:var(--paper);border:1px solid #4a3a2a;border-radius:4px;padding:6px 10px;font:inherit;cursor:pointer}
#bar .sp{flex:1}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none}
#stage img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 0 30px #000}
.zone{position:absolute;top:0;bottom:0;width:35%;cursor:pointer}.zl{left:0}.zr{right:0}
#scroll{display:none;padding-bottom:40px}#scroll img{display:block;width:100%;max-width:1280px;margin:0 auto 6px}
#prog{height:3px;background:var(--sep);width:0;transition:width .2s}
#end{display:none;position:absolute;inset:0;background:rgba(10,8,6,.92);flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
#end button{background:var(--sep);color:#fff;border:0;border-radius:4px;padding:10px 18px;font:inherit;cursor:pointer}
@media (max-width:600px){.ch img{width:110px}#bar{font-size:12px}#pageLbl{display:none}}
</style></head><body>
<div id="home">
  <h1>The Will of the Broken Heir</h1>
  <div class="sub">A Takamori family drama · English edition</div>
  <img class="cover" src="img/ch1/p01.jpg" alt="Chapter 1 opening page">
  <a class="resume" id="resumeBtn" style="display:none"></a>
  <div id="list"></div>
</div>
<div id="reader">
  <div id="bar">
    <button onclick="home()">☰ Chapters</button>
    <select id="chSel" onchange="openCh(+this.value,0)"></select>
    <span id="pageLbl"></span><span class="sp"></span>
    <button id="modeBtn" onclick="toggleMode()">Long scroll</button>
    <button onclick="fs()">⛶</button>
  </div>
  <div id="prog"></div>
  <div id="stage">
    <img id="pg" alt="">
    <div class="zone zl" onclick="go(-1)"></div><div class="zone zr" onclick="go(1)"></div>
    <div id="end"><div id="endTxt"></div><button id="nextBtn"></button><button onclick="home()">Back to chapters</button></div>
  </div>
  <div id="scroll"></div>
</div>
<script>
const CH=[ // add a chapter: {t:"Chapter 3",n:12}
 {t:"Chapter 1",n:12},
 {t:"Chapter 2",n:11},
];
const src=(c,p)=>`img/ch${c+1}/p${String(p+1).padStart(2,'0')}.jpg`;
let c=0,p=0,mode=localStorage.mode2||'scroll';
const $=id=>document.getElementById(id);
$('list').innerHTML=CH.map((x,i)=>`<a class="ch" onclick="openCh(${i},0)"><img src="${src(i,0)}" loading="lazy"><div><b>${x.t}</b><small>${x.n} pages</small></div></a>`).join('');
$('chSel').innerHTML=CH.map((x,i)=>`<option value="${i}">${x.t}</option>`).join('');
const saved=JSON.parse(localStorage.pos||'null');
if(saved){$('resumeBtn').style.display='inline-block';$('resumeBtn').textContent=`Continue ${CH[saved.c].t}, page ${saved.p+1}`;$('resumeBtn').onclick=()=>openCh(saved.c,saved.p);}
function openCh(i,pg){c=i;p=pg;$('home').style.display='none';$('reader').style.display='flex';$('chSel').value=i;
 $('scroll').innerHTML=Array.from({length:CH[i].n},(_,k)=>`<img src="${src(i,k)}" loading="lazy" alt="Page ${k+1}">`).join('')+(i+1<CH.length?`<div style="text-align:center;margin:24px"><button onclick="openCh(${i+1},0)" style="background:#8a6a45;color:#fff;border:0;border-radius:4px;padding:12px 20px;font:inherit">Read ${CH[i+1].t} →</button></div>`:`<p style="text-align:center;color:#b9a07a">End of ${CH[i].t} · More chapters coming soon</p>`);
 applyMode();show();history.replaceState(null,'',`#c${i+1}p${pg+1}`);}
function show(){$('end').style.display='none';$('pg').src=src(c,p);$('pageLbl').textContent=`Page ${p+1} / ${CH[c].n}`;
 $('prog').style.width=((p+1)/CH[c].n*100)+'%';localStorage.pos=JSON.stringify({c,p});history.replaceState(null,'',`#c${c+1}p${p+1}`);
 if(p+1<CH[c].n){new Image().src=src(c,p+1);}}
function go(d){if($('end').style.display=='flex'){if(d<0){show();}return;}
 const np=p+d;if(np<0){if(c>0)openCh(c-1,CH[c-1].n-1);return;}
 if(np>=CH[c].n){$('end').style.display='flex';$('endTxt').textContent=`End of ${CH[c].t}`;
  if(c+1<CH.length){$('nextBtn').style.display='';$('nextBtn').textContent=`Read ${CH[c+1].t} →`;$('nextBtn').onclick=()=>openCh(c+1,0);}
  else{$('nextBtn').style.display='none';$('endTxt').textContent+=' · More chapters coming soon';}return;}
 p=np;show();}
function home(){$('reader').style.display='none';$('home').style.display='block';history.replaceState(null,'',location.pathname);location.reload();}
function applyMode(){const s=mode=='scroll';const R=$('reader');R.style.position=s?'static':'fixed';R.style.minHeight=s?'100vh':'';$('bar').style.position=s?'sticky':'';$('bar').style.top='0';$('bar').style.zIndex='5';document.body.style.overflow=s?'auto':'hidden';$('stage').style.display=s?'none':'flex';$('scroll').style.display=s?'block':'none';$('modeBtn').textContent=s?'Page by page':'Long scroll';
 if(s){const im=$('scroll').children[p];setTimeout(()=>{if(im&&p>0)im.scrollIntoView();else window.scrollTo(0,0);},80);}}
function toggleMode(){mode=mode=='page'?'scroll':'page';localStorage.mode2=mode;applyMode();}
function fs(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
document.addEventListener('keydown',e=>{if($('reader').style.display!='flex'||mode=='scroll')return;
 if(['ArrowRight','d',' '].includes(e.key)){e.preventDefault();go(1);}if(['ArrowLeft','a'].includes(e.key))go(-1);if(e.key=='Escape')home();});
let tx=null;$('stage').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
$('stage').addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)go(dx<0?1:-1);tx=null;});
window.addEventListener('scroll',()=>{if(mode!='scroll'||$('reader').style.display!='flex')return;const ims=[...$('scroll').querySelectorAll('img')];const k=ims.findIndex(im=>im.getBoundingClientRect().bottom>innerHeight/2);if(k>=0&&k!=p){p=k;$('pageLbl').textContent=`Page ${p+1} / ${CH[c].n}`;$('prog').style.width=((p+1)/CH[c].n*100)+'%';localStorage.pos=JSON.stringify({c,p});}});
const m=location.hash.match(/c(\d+)p(\d+)/);if(m&&CH[m[1]-1])openCh(m[1]-1,Math.min(m[2]-1,CH[m[1]-1].n-1));
</script></body></html>
