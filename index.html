<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100e0c">
<meta name="description" content="Read Migawari — The Takamori Heir.">
<title>Migawari</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500&text=%E8%BA%AB%E4%BB%A3%E3%82%8F%E3%82%8A&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #100e0c;
  --surface: #1a1613;
  --fg: #f3eadb;
  --muted: #a89884;
  --faint: #7a6e62;
  --line: #3a322a;
  --paper: #f3eadb;
  --ink: #161310;
  --display: "Cormorant Garamond", Palatino, "Hiragino Mincho ProN", serif;
  --sans: Outfit, "Avenir Next", "Segoe UI", sans-serif;
  --jp: "Noto Serif JP", "Hiragino Mincho ProN", serif;
}
* { box-sizing: border-box; }
html { background: var(--bg); color: var(--fg); color-scheme: dark; -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--fg); font-family: var(--sans); }
button, a { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
a { text-decoration: none; }
img { max-width: 100%; }
.safe-top { padding-top: max(12px, env(safe-area-inset-top)); }
.safe-bottom { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
.shelf { max-width: 64rem; margin: 0 auto; padding: 24px 20px 64px; }
.kicker { margin: 0; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 8px 0 0; font-family: var(--display); font-weight: 500; font-size: 3rem; line-height: 1; }
.jp { margin: 12px 0 0; font-family: var(--jp); font-size: 1.125rem; color: var(--muted); }
.lede { max-width: 24rem; margin: 16px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
.grid { margin-top: 32px; display: grid; gap: 24px; }
@media (min-width: 800px) { .grid { grid-template-columns: 1.35fr 1fr; align-items: start; } }
.cover { display: block; overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); }
.cover img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; }
.cover span { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; }
.cover b { font-family: var(--display); font-weight: 500; font-size: 1.25rem; }
.cover small { color: var(--muted); }
.continue { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 20px; border-radius: 999px; background: var(--paper); color: var(--ink); font-size: 14px; font-weight: 500; }
.chapters { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.ch { display: flex; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); }
.ch img { width: 112px; height: 64px; object-fit: cover; border-radius: 8px; flex: none; }
.ch .body { min-width: 0; flex: 1; }
.ch .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.ch h2 { margin: 0; font-family: var(--display); font-weight: 500; font-size: 1.5rem; line-height: 1; }
.ch .tag { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.ch p { margin: 6px 0 0; color: var(--muted); font-size: 14px; line-height: 1.35; }
.bar { margin-top: 12px; height: 1px; background: var(--line); }
.bar i { display: block; height: 1px; background: var(--paper); }
.meta { display: block; margin-top: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.note { margin: 16px 4px 0; font-size: 12px; color: var(--faint); }
.reader { position: fixed; inset: 0; background: var(--bg); }
.stage { position: absolute; inset: 0; overflow: hidden; touch-action: none; user-select: none; }
.stage img.page { position: absolute; top: 0; left: 0; width: 1280px; height: 720px; max-width: none; transform-origin: 0 0; }
.scroll { height: 100%; overflow-y: auto; }
.scroll ol { list-style: none; margin: 0 auto; padding: 72px 0 96px; max-width: 48rem; }
.scroll li { border-bottom: 1px solid var(--line); }
.scroll img { display: block; width: 100%; height: auto; }
.scroll .end { max-width: 28rem; margin: 0 auto; padding: 40px 20px 24px; }
.hair { position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--line); z-index: 10; pointer-events: none; }
.hair i { display: block; height: 1px; background: var(--paper); }
.chrome { position: absolute; left: 0; right: 0; z-index: 20; background: var(--bg); border-color: var(--line); transition: opacity 200ms ease; }
.chrome.off { opacity: 0; pointer-events: none; }
.head { top: 0; border-bottom: 1px solid var(--line); }
.foot { bottom: 0; border-top: 1px solid var(--line); }
.head-row, .foot-row { display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 8px; }
.head-row .grow { min-width: 0; flex: 1; padding: 0 4px; }
.head-row strong { display: block; font-family: var(--display); font-weight: 500; font-size: 1.25rem; line-height: 1; }
.head-row em { display: block; margin-top: 2px; font-style: normal; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tap { height: 44px; padding: 0 12px; border-radius: 999px; font-size: 14px; }
.scrub { flex: 1; min-width: 0; accent-color: var(--paper); height: 44px; }
.count { width: 48px; text-align: right; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sheet { position: absolute; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; background: color-mix(in srgb, var(--bg) 80%, transparent); padding: 16px; }
@media (min-width: 700px) { .sheet { align-items: center; } }
.card { width: min(100%, 24rem); border: 1px solid var(--line); border-radius: 28px; background: var(--surface); padding: 24px; }
.card h2 { margin: 8px 0 0; font-family: var(--display); font-weight: 500; font-size: 2.25rem; }
.card p { color: var(--muted); font-size: 14px; line-height: 1.5; }
.card .stack { display: flex; flex-direction: column; gap: 8px; margin-top: 24px; }
.primary { height: 48px; border-radius: 999px; background: var(--paper); color: var(--ink); font-size: 14px; font-weight: 500; }
.ghost { height: 44px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; }
.quiet { height: 44px; color: var(--muted); font-size: 14px; }
.coach { position: absolute; left: 0; right: 0; bottom: 0; z-index: 40; padding: 16px; }
.coach .card ul { margin: 12px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; line-height: 1.5; }
.coach .card h2 { font-size: 1.5rem; }
.fail { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
@media (prefers-reduced-motion: reduce) { .can-glide { transition: none !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
const CHAPTERS = [
  { id: 1, title: "Chapter 1", kicker: "Sixteen years", pages: 12,
    blurb: "The true heir of the Takamori family vanished. Tonight, the dead patriarch would have his final say." },
  { id: 2, title: "Chapter 2", kicker: "The rain", pages: 11,
    blurb: "She comes to the door early. Inside the house, the days have already started to count down." }
];
const IW = 1280, IH = 720, KEY = "migawari-reader-v1";
const $ = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
const chapter = (id) => CHAPTERS.find((c) => c.id === id);
const src = (id, i) => `img/ch${id}/p${String(i + 1).padStart(2, "0")}.jpg`;
const clamp = (n, count) => Math.min(count - 1, Math.max(0, n));
function load() {
  try { return Object.assign({ chapter: 1, page: 0, mode: "page", view: "read", coach: false, positions: {}, furthest: {} }, JSON.parse(localStorage.getItem(KEY) || "null") || {}); }
  catch { return { chapter: 1, page: 0, mode: "page", view: "read", coach: false, positions: {}, furthest: {} }; }
}
function save(patch) {
  const prev = load();
  const next = Object.assign({}, prev, patch);
  if (patch.chapter != null && patch.page != null) {
    const key = String(patch.chapter);
    next.positions = Object.assign({}, prev.positions, { [key]: patch.page });
    next.furthest = Object.assign({}, prev.furthest, { [key]: Math.max(prev.furthest[key] || 0, patch.page) });
  }
  localStorage.setItem(KEY, JSON.stringify(next));
  return next;
}
function fitScale(w, h) { return Math.min(w / IW, h / IH); }
function place(view, w, h) {
  const fit = fitScale(w, h);
  const scale = view === "fit" ? fit : Math.max(fit, h / IH);
  const pw = IW * scale, ph = IH * scale, overflow = pw - w;
  return { fit, scale, tx: pw <= w ? (w - pw) / 2 : overflow < w * 0.18 ? (w - pw) / 2 : 0, ty: ph <= h ? (h - ph) / 2 : 0 };
}
function clampPan(tx, ty, scale, w, h) {
  const pw = IW * scale, ph = IH * scale;
  return {
    tx: pw <= w ? (w - pw) / 2 : Math.min(0, Math.max(w - pw, tx)),
    ty: ph <= h ? (h - ph) / 2 : Math.min(0, Math.max(h - ph, ty))
  };
}
function clampScale(s, fit) { return Math.min(fit * 4, Math.max(fit, s)); }

const root = document.getElementById("root");
let state = { screen: "shelf" };

function route() {
  const m = location.hash.match(/^#\/(\d+)\/(\d+)/);
  if (!m) { showShelf(); return; }
  const ch = chapter(Number(m[1]));
  if (!ch) { showShelf(); return; }
  showReader(ch.id, clamp(Number(m[2]) - 1, ch.pages));
}
function goShelf() { history.pushState(null, "", location.pathname + location.search); showShelf(); }
function goPage(id, index, replace) {
  const ch = chapter(id);
  const page = clamp(index, ch.pages);
  const url = `#/${id}/${page + 1}`;
  if (replace) history.replaceState(null, "", url); else history.pushState(null, "", url);
  showReader(id, page);
}

function showShelf() {
  state = { screen: "shelf" };
  const store = load();
  const saved = chapter(store.chapter);
  const resume = saved && (store.page > 0 || store.chapter > 1);
  root.replaceChildren($(`<main class="shelf safe-top"></main>`));
  const main = root.firstChild;
  main.append($(`<header>
    <p class="kicker">The Takamori Heir</p>
    <h1>Migawari</h1>
    <p class="jp">身代わり</p>
    <p class="lede">English edition. Two chapters of the house that lost its heir — drawn wide, meant to be read up close.</p>
  </header>`));
  const grid = $(`<div class="grid"></div>`);
  const cover = $(`<a class="cover" href="#/1/1"><img alt="Opening page: the Takamori gates in the rain"><span><b>Begin at the gates</b><small>Chapter 1</small></span></a>`);
  cover.querySelector("img").src = src(1, 0);
  cover.addEventListener("click", (e) => { e.preventDefault(); goPage(1, 0); });
  grid.append(cover);
  const side = $(`<section></section>`);
  if (resume) {
    const btn = $(`<a class="continue" href="#/${saved.id}/${store.page + 1}"><span>Continue</span><span>${saved.title} · ${store.page + 1}</span></a>`);
    btn.addEventListener("click", (e) => { e.preventDefault(); goPage(saved.id, store.page); });
    side.append(btn);
  }
  const list = $(`<ol class="chapters"></ol>`);
  for (const ch of CHAPTERS) {
    const key = String(ch.id);
    const far = store.furthest[key];
    const opened = far != null;
    const pct = opened ? Math.round(((far + 1) / ch.pages) * 100) : 0;
    const start = opened ? (store.positions[key] ?? 0) : 0;
    const item = $(`<li><a class="ch" href="#/${ch.id}/${start + 1}">
      <img alt="">
      <span class="body">
        <span class="row"><h2>${ch.title}</h2><span class="tag">${ch.kicker}</span></span>
        <p>${ch.blurb}</p>
        <span class="bar"><i style="width:${pct}%"></i></span>
        <span class="meta">${opened ? `${far + 1} of ${ch.pages} pages` : `${ch.pages} pages`}</span>
      </span>
    </a></li>`);
    item.querySelector("img").src = src(ch.id, 0);
    item.querySelector("a").addEventListener("click", (e) => { e.preventDefault(); goPage(ch.id, start); });
    list.append(item);
  }
  side.append(list, $(`<p class="note">More chapters when they are ready.</p>`));
  grid.append(side);
  main.append(grid);
}

function showReader(id, page) {
  const ch = chapter(id);
  const store = load();
  const fresh = state.screen !== "read" || state.id !== id;
  state = {
    screen: "read", id, page, ch,
    mode: state.mode || store.mode || "page",
    view: state.view || store.view || "read",
    chrome: true, end: false, coach: fresh ? !store.coach && (store.mode || "page") === "page" : state.coach,
    tx: 0, ty: 0, scale: 1, swipe: 0, glide: false, ready: false, failed: false, fit: 1
  };
  if (fresh) state.coach = !store.coach;
  save({ chapter: id, page, mode: state.mode, view: state.view });
  paintReader();
  if (state.mode === "page") bindStage();
  hideChromeLater();
}

let chromeTimer = 0;
function hideChromeLater(stay) {
  clearTimeout(chromeTimer);
  state.chrome = true;
  syncChrome();
  if (stay || state.end || state.coach) return;
  chromeTimer = setTimeout(() => { state.chrome = false; syncChrome(); }, 3200);
}
function syncChrome() {
  document.querySelectorAll(".chrome").forEach((el) => el.classList.toggle("off", !(state.chrome || state.end)));
  const live = document.getElementById("page-live");
  if (live) live.textContent = `Page ${state.page + 1} of ${state.ch.pages}`;
  const count = document.getElementById("count");
  if (count) count.textContent = `${state.page + 1}/${state.ch.pages}`;
  const hair = document.getElementById("hair");
  if (hair) hair.style.width = `${((state.page + 1) / state.ch.pages) * 100}%`;
  const scrub = document.getElementById("scrub");
  if (scrub && Number(scrub.value) !== state.page + 1) scrub.value = String(state.page + 1);
  const zoomBtn = document.getElementById("zoom-btn");
  if (zoomBtn) zoomBtn.textContent = (state.scale > state.fit * 1.08 || state.view === "read") ? "Whole page" : "Closer";
}

function paintReader() {
  const { ch, page, mode } = state;
  const next = chapter(ch.id + 1);
  root.replaceChildren($(`<div class="reader"></div>`));
  const box = root.firstChild;
  if (mode === "page") {
    const stage = $(`<div class="stage" id="stage"></div>`);
    const img = $(`<img class="page can-glide" id="page-img" draggable="false" width="1280" height="720" alt="Chapter ${ch.id}, page ${page + 1}">`);
    img.src = src(ch.id, page);
    img.addEventListener("error", () => { state.failed = true; paintFail(); });
    img.addEventListener("load", () => { state.failed = false; });
    stage.append(img);
    stage.addEventListener("contextmenu", (e) => e.preventDefault());
    box.append(stage);
  } else {
    const sc = $(`<div class="scroll" id="scroller"></div>`);
    const ol = $(`<ol></ol>`);
    for (let i = 0; i < ch.pages; i++) {
      const li = $(`<li data-index="${i}"><img alt="Chapter ${ch.id}, page ${i + 1}" ${Math.abs(i - page) < 2 ? "" : 'loading="lazy"'}></li>`);
      li.querySelector("img").src = src(ch.id, i);
      ol.append(li);
    }
    sc.append(ol);
    const end = $(`<div class="end"><p class="kicker">End of ${ch.title}</p></div>`);
    if (next) {
      const b = $(`<button class="primary" type="button">${next.title}</button>`);
      b.addEventListener("click", () => goPage(next.id, 0));
      end.append(b);
    } else end.append($(`<p>More chapters when they are ready.</p>`));
    const back = $(`<button class="quiet" type="button">Back to the shelf</button>`);
    back.addEventListener("click", goShelf);
    end.append(back);
    sc.append(end);
    sc.addEventListener("scroll", onScroll, { passive: true });
    box.append(sc);
  }
  box.append($(`<div class="hair"><i id="hair"></i></div>`));
  const head = $(`<header class="chrome head safe-top"><div class="head-row">
    <button class="tap" id="shelf-btn" type="button">Shelf</button>
    <div class="grow"><strong>${ch.title}</strong><em id="page-live"></em></div>
    <button class="tap" id="mode-btn" type="button">${mode === "page" ? "Scroll" : "Pages"}</button>
  </div></header>`);
  head.querySelector("#shelf-btn").addEventListener("click", goShelf);
  head.querySelector("#mode-btn").addEventListener("click", () => {
    state.mode = state.mode === "page" ? "scroll" : "page";
    save({ chapter: ch.id, page: state.page, mode: state.mode, view: state.view });
    showReader(ch.id, state.page);
    hideChromeLater(true);
  });
  const foot = $(`<footer class="chrome foot safe-bottom"><div class="foot-row">
    ${mode === "page" ? `<button class="tap" id="zoom-btn" type="button">Whole page</button>` : `<span class="count" style="width:auto">Skim</span>`}
    <input class="scrub" id="scrub" type="range" min="1" max="${ch.pages}" aria-label="Page">
    <span class="count" id="count"></span>
  </div></footer>`);
  const scrub = foot.querySelector("#scrub");
  scrub.value = String(page + 1);
  scrub.addEventListener("input", () => jump(Number(scrub.value) - 1));
  const zoom = foot.querySelector("#zoom-btn");
  if (zoom) zoom.addEventListener("click", () => {
    applyView(state.scale > state.fit * 1.08 || state.view === "read" ? "fit" : "read", true);
    hideChromeLater();
  });
  box.append(head, foot);
  if (state.end) box.append(endSheet(next));
  if (state.coach && mode === "page" && !state.end) box.append(coachSheet());
  syncChrome();
  if (mode === "scroll") {
    requestAnimationFrame(() => {
      document.querySelector(`[data-index="${page}"]`)?.scrollIntoView();
    });
  } else {
    requestAnimationFrame(() => applyView(state.view, false));
    preload(ch.id, page);
  }
}

function paintFail() {
  const stage = document.getElementById("stage");
  if (!stage || stage.querySelector(".fail")) return;
  const fail = $(`<div class="fail"><p>This page did not load.</p></div>`);
  const b = $(`<button class="ghost" type="button">Try again</button>`);
  b.addEventListener("click", () => { const img = document.getElementById("page-img"); if (img) img.src = src(state.id, state.page) + "?r=" + Date.now(); fail.remove(); });
  fail.append(b);
  stage.append(fail);
}

function endSheet(next) {
  const sheet = $(`<div class="sheet"><div class="card safe-bottom">
    <p class="kicker">End of chapter</p>
    <h2>${state.ch.title}</h2>
    <p>${next ? `Next is ${next.title}. ${next.blurb}` : "More chapters when they are ready."}</p>
    <div class="stack"></div>
  </div></div>`);
  const stack = sheet.querySelector(".stack");
  if (next) {
    const b = $(`<button class="primary" type="button">Read ${next.title}</button>`);
    b.addEventListener("click", () => goPage(next.id, 0));
    stack.append(b);
  }
  const stay = $(`<button class="ghost" type="button">Stay on this page</button>`);
  stay.addEventListener("click", () => { state.end = false; sheet.remove(); hideChromeLater(); });
  const shelf = $(`<button class="quiet" type="button">Shelf</button>`);
  shelf.addEventListener("click", goShelf);
  stack.append(stay, shelf);
  return sheet;
}
function coachSheet() {
  const wrap = $(`<div class="coach safe-bottom"><div class="card">
    <p class="kicker">Migawari</p>
    <h2>How to read on a phone</h2>
    <ul>
      <li>Drag to move across the page. The type is drawn wide, so start in close.</li>
      <li>Tap the left or right edge to turn. A fast flick at the edge does the same.</li>
      <li>Double-tap a panel to zoom. Whole page shows the full spread.</li>
      <li>Turn the phone sideways and the page fills the screen.</li>
    </ul>
  </div></div>`);
  const b = $(`<button class="primary" type="button" style="width:100%;margin-top:20px">Start reading</button>`);
  b.addEventListener("click", () => {
    state.coach = false;
    save({ coach: true, chapter: state.id, page: state.page, mode: state.mode, view: state.view });
    wrap.remove();
    hideChromeLater();
  });
  wrap.querySelector(".card").append(b);
  return wrap;
}

function jump(index) {
  state.end = false;
  if (state.mode === "scroll") document.querySelector(`[data-index="${index}"]`)?.scrollIntoView();
  goPage(state.id, index, true);
}
let scrollLock = false;
function onScroll() {
  if (scrollLock || state.mode !== "scroll") return;
  const rootEl = document.getElementById("scroller");
  if (!rootEl) return;
  const edge = rootEl.getBoundingClientRect().top + 72;
  let best = 0;
  rootEl.querySelectorAll("[data-index]").forEach((el) => {
    if (el.getBoundingClientRect().top - edge <= 8) best = Number(el.dataset.index);
  });
  if (best !== state.page) {
    state.page = best;
    save({ chapter: state.id, page: best, mode: state.mode, view: state.view });
    history.replaceState(null, "", `#/${state.id}/${best + 1}`);
    syncChrome();
  }
}
function preload(id, page) {
  [page - 1, page + 1].forEach((i) => { if (i >= 0 && i < state.ch.pages) { const im = new Image(); im.src = src(id, i); } });
}
function applyView(view, animate) {
  const stage = document.getElementById("stage");
  if (!stage) return;
  const r = stage.getBoundingClientRect();
  if (r.width <= 0) return;
  state.view = view;
  const p = place(view, r.width, r.height);
  state.fit = p.fit; state.scale = p.scale; state.tx = p.tx; state.ty = p.ty; state.swipe = 0; state.glide = animate; state.ready = true;
  draw();
  save({ chapter: state.id, page: state.page, mode: state.mode, view });
}
function draw() {
  const img = document.getElementById("page-img");
  if (!img) return;
  img.style.transition = state.glide ? "transform 220ms cubic-bezier(0.22, 1, 0.36, 1)" : "none";
  img.style.transform = `translate3d(${state.tx + state.swipe}px, ${state.ty}px, 0) scale(${state.scale})`;
  img.style.opacity = state.ready && !state.failed ? "1" : "0";
  const zoomBtn = document.getElementById("zoom-btn");
  if (zoomBtn) zoomBtn.textContent = (state.scale > state.fit * 1.08 || state.view === "read") ? "Whole page" : "Closer";
}
function turn(delta) {
